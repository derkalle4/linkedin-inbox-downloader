name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile check
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/derkalle4/linkedin-inbox-downloader/internal/version.Version=${VERSION}" \
            -o "linkedin-inbox-downloader-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" \
            ./cmd/linkedin-inbox-downloader
