# Complete config for LinkedIn Inbox Downloader.
# Place this file next to the binary as config.yaml
# (the interactive UI creates it when you accept the disclaimer).

# Must be true for --headless (and for normal use after first launch).
disclaimer_accepted: true

# Folder for PDF backups. Relative paths are resolved next to the binary.
# Absolute paths are also allowed.
download_path: archive

# Also write message pictures next to each PDF as {pdf-stem}_img_01.jpg,
# {pdf-stem}_img_02.jpg, … Images stay embedded in the PDF. Existing files
# are never overwritten; numbering always starts at 01 from the first image
# in the thread so a new picture in a later message becomes the next index.
download_images: false
